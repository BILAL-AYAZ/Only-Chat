<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O-Chat By Systex</title>
    <script defer src="http://localhost:3000/socket.io/socket.io.js"></script>
    <script defer src="logic/javascriptfol/client.js"></script>
    <link rel="stylesheet" href="logic/css/style.css">
    <!--<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
          integrity="sha512-x+631g5/8s+a3y34J+bD6hJ1sY9rFufJ7x9CAc8W/rI5fq3au3FbtK0bsvjVFQucb0ehvNg=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />-->
</head>
<body>
    <div class="sign-in ">
        <input type="text" name="id" id="user-name" placeholder="Enter Your Name And Pass Enter" autocomplete="off">
    </div>
    <div class="blur "></div>
    <div class="all">
        <nav>
            <img src="logic/my what Icon-dark blue.jpg" alt="logo" class="logo">
            <h2>Welcome To <u><b>Only-Chat</b></u> Web Application By Systex W|D</h2>
        </nav>
        <div class="container"></div>
        <div class="send">
            <form action="#" id="send-container">
                <input type="text" name="message-inp" id="messageInp" placeholder="Write Message Here" autocomplete="off">
                <button class="btn" type="submit"><i class="fa-solid fa-paper-plane"></i> SEND</button>
            </form>
        </div>
    </div>
</body>
</html>
